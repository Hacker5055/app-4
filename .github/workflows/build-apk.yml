name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── The shipping app: Flutter + Kotlin security module ──
  flutter-apk:
    name: Flutter release APK (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: canary-flutter-arm64-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  # ── The framework-only build that needs no Flutter engine ──
  native-apk:
    name: Native Kotlin APK (aapt2 + d8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        id: sdk
        run: |
          echo "sdk=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}" >> "$GITHUB_OUTPUT"

      - name: Fetch Kotlin compiler
        run: |
          curl -sSLo /tmp/kotlin.zip \
            https://github.com/JetBrains/kotlin/releases/download/v1.9.24/kotlin-compiler-1.9.24.zip
          unzip -q /tmp/kotlin.zip -d /opt
          echo "KOTLINC=/opt/kotlinc/bin/kotlinc" >> "$GITHUB_ENV"

      - name: Build
        env:
          ANDROID_JAR: ${{ steps.sdk.outputs.sdk }}/platforms/android-34/android.jar
          BUILD_TOOLS: ${{ steps.sdk.outputs.sdk }}/build-tools/34.0.0
        run: ./native/build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: canary-native-apk
          path: native/build/*.apk
          if-no-files-found: error
